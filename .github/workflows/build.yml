
name: Build Days Gone Plugin

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld make git

      - name: Download OpenOrbis Toolchain
        run: |
          curl -sL https://github.com/illusion0001/OpenOrbis-PS4-Toolchain/releases/latest/download/toolchain.tar.gz | tar xz -C ./
          echo "OO_PS4_TOOLCHAIN=$GITHUB_WORKSPACE/OpenOrbis/PS4Toolchain" >> $GITHUB_ENV

      - name: Download GoldHEN SDK
        run: |
          git clone --depth 1 https://github.com/GoldHEN/GoldHEN_Plugins_SDK.git /opt/goldhen-sdk

      - name: Verify toolchain
        run: |
          test -f "$OO_PS4_TOOLCHAIN/include/orbis/libkernel.h"
          test -f "$OO_PS4_TOOLCHAIN/link.x"
          test -f /opt/goldhen-sdk/include/Common.h
          test -f /opt/goldhen-sdk/crt/crtprx.c
          test -f "$OO_PS4_TOOLCHAIN/bin/linux/create-fself"

      - name: Compile plugin
        run: |
          make clean
          make

      - name: Verify PRX
        run: |
          test -s DaysGoneSpawner.prx
          file DaysGoneSpawner.prx

      - name: Upload PRX
        uses: actions/upload-artifact@v4
        with:
          name: DaysGoneSpawner-PRX
          path: DaysGoneSpawner.prx
          if-no-files-found: error
          
