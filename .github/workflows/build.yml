name: Compilar DaysGone Hordes (OpenOrbis)

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descarregar o Código do Repositório
      uses: actions/checkout@v4

    - name: Instalar Dependências e Clonar OpenOrbis Toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y clang lld make git
        git clone https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git /opt/openorbis
        echo "OO_PS4_TOOLCHAIN=/opt/openorbis" >> $GITHUB_ENV
        echo "/opt/openorbis/bin" >> $GITHUB_PATH

    - name: Compilar Plugin .prx
      run: |
        make clean
        make

    - name: Guardar o ficheiro .prx compilado (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: DaysGoneHordes-Plugin
        path: DaysGoneSpawner.prx
