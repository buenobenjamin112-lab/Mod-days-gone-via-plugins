
name: Build Days Gone Plugin

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make git

      - name: Download OpenOrbis Toolchain
        run: |
          git clone --depth 1 \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git \
            /opt/openorbis

      - name: Download GoldHEN SDK
        run: |
          git clone --depth 1 \
            https://github.com/GoldHEN/GoldHEN_Plugins_SDK.git \
            /opt/goldhen-sdk

      - name: Verify headers
        run: |
          test -f /opt/goldhen-sdk/include/Common.h
          test -f /opt/openorbis/include/orbis/libkernel.h

      - name: Compile plugin
        run: |
          make clean
          make

      - name: Upload PRX
        uses: actions/upload-artifact@v4
        with:
          name: DaysGoneSpawner
          path: DaysGoneSpawner.prx
          if-no-files-found: error
